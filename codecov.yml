coverage:
  range: 60..80
  round: down
  precision: 2
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        informational: false
    patch:
      default:
        target: 75%
        threshold: 1%
        informational: false

codecov:
  max_report_age: off

flag_management:
  default_rules:
    carryforward: false
    statuses:
      - name_prefix: proj-
        type: project
        target: auto
        threshold: 1%
      - name_prefix: patch-
        type: patch
        threshold: 1%
        target: 75%
  individual_flags:
    # App module
    - name: app
      paths:
        - app/
      carryforward: false
      
    # Core modules
    - name: core-adapter
      paths:
        - core/adapter/
      carryforward: false

    - name: core-common
      paths:
        - core/common/
      carryforward: false
        
    - name: core-coroutines
      paths:
        - core/coroutines/
      carryforward: false
        
    - name: core-data
      paths:
        - core/data/
      carryforward: false
        
    - name: core-database
      paths:
        - core/database/
      carryforward: false
        
    - name: core-model
      paths:
        - core/model/
      carryforward: false
        
    - name: core-favoritewatchlist
      paths:
        - core/favoritewatchlist/
      carryforward: false

    - name: core-instrumentationtest
      paths:
        - core/instrumentationtest/
      carryforward: false
        
    - name: core-mapper
      paths:
        - core/mapper/
      carryforward: false
        
    - name: core-network
      paths:
        - core/network/
      carryforward: false
        
    - name: core-test
      paths:
        - core/test/
      carryforward: false

    - name: core-testmodule
      paths:
        - core/testmodule/
      carryforward: false
        
    - name: core-uihelper
      paths:
        - core/uihelper/
      carryforward: false
        
    - name: core-utils
      paths:
        - core/utils/
      carryforward: false
        
    - name: core-user
      paths:
        - core/user/
      carryforward: false
        
    # Feature modules
    - name: feature-about
      paths:
        - feature/about/
      carryforward: false
        
    - name: feature-detail
      paths:
        - feature/detail/
      carryforward: false
        
    - name: feature-favorite
      paths:
        - feature/favorite/
      carryforward: false
        
    - name: feature-home
      paths:
        - feature/home/
      carryforward: false
        
    - name: feature-list
      paths:
        - feature/list/
      carryforward: false

    - name: feature-login
      paths:
        - feature/login/
      carryforward: false
        
    - name: feature-more
      paths:
        - feature/more/
      carryforward: false
        
    - name: feature-person
      paths:
        - feature/person/
      carryforward: false
        
    - name: feature-search
      paths:
        - feature/search/
      carryforward: false
        
    - name: feature-watchlist
      paths:
        - feature/watchlist/
      carryforward: false

    - name: navigation
      paths:
        - navigation
      carryforward: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
